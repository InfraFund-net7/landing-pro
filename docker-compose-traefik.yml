version: '3.9'

services:
  app:
    build: .
    ports:
      - "8080"
    environment:
      - PORT=${PORT:-8080}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}.rule=Host(`${APP_NAME}.app.dev.infrafund.net`)"
      - "traefik.http.routers.${APP_NAME}.entrypoints=websecure"
      - "traefik.http.services.${APP_NAME}.loadbalancer.server.port=${PORT:-8080}"
      - "traefik.http.routers.${APP_NAME}.tls=true"
      - "traefik.http.routers.${APP_NAME}.tls.certresolver=letsencrypt"

networks:
  traefik-net:
    external: true