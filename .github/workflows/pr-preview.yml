name: Deploy PR preview to VPS

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare VPS Deployment
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_NAME=pr-${{ github.event.pull_request.number }}
            APP_PATH=${{ secrets.VPS_PROJECT_ROOT }}/$APP_NAME
            mkdir -p $APP_PATH
            cd $APP_PATH
            docker-compose -f docker-compose.traefik.yml down || true
            cd ..
            sudo rm -rf $APP_PATH/* || true
            docker image prune -f

      - name: Copy files to VPS
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: './'
          target: ${{ secrets.VPS_PROJECT_ROOT }}/pr-${{ github.event.pull_request.number }}

      - name: Deploy on VPS via SSH
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_NAME=pr-${{ github.event.pull_request.number }}
            APP_PATH=${{ secrets.VPS_PROJECT_ROOT }}/$APP_NAME
            cd $APP_PATH
            echo "APP_NAME=$APP_NAME" > .env
            echo "HOSTS=Host(\`${APP_NAME}.app.dev.infrafund.net\`)" >> .env
            echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.DEV_API_BASE_URL }}" >> .env
            docker-compose -f docker-compose.traefik.yml up -d --build --remove-orphans
            docker image prune -f

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize')
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const previewUrl = `https://pr-${{ github.event.pull_request.number }}.${{ secrets.VPS_DOMAIN }}`;
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview URL: ${previewUrl}`
            });

      - name: Cleanup VPS Deployment
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_NAME=pr-${{ github.event.pull_request.number }}
            APP_PATH=${{ secrets.VPS_PROJECT_ROOT }}/$APP_NAME
            cd $APP_PATH
            docker-compose -f docker-compose.traefik.yml down || true
            cd ..
            sudo rm -rf "$APP_NAME"
            docker image prune -f
