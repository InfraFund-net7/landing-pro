name: Deploy PR preview to VPS

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read  # Required for checkout and code access
  issues: write   # Required for creating PR comments

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create app name from pr number
        id: vars
        run: |
          echo "APP_NAME=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "APP_PATH=${{ secrets.VPS_PROJECT_ROOT }}/pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Prepare VPS Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            APP_NAME=pr-${{ github.event.pull_request.number }}
            APP_PATH=${{ secrets.VPS_PROJECT_ROOT }}/$APP_NAME
            mkdir -p $APP_PATH
            cd $APP_PATH
            docker-compose down
            cd ..
            sudo rm -rf $APP_PATH/*
            docker image prune -f
        
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "./"
          target: ${{ env.APP_PATH }}

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            APP_NAME=pr-${{ github.event.pull_request.number }}
            APP_PATH=${{ secrets.VPS_PROJECT_ROOT }}/$APP_NAME
            cd $APP_PATH
            echo "APP_NAME=$APP_NAME" > .env
            docker-compose up -d --remove-orphans
            docker image prune -f

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Preview URL: http://pr-${{ github.event.pull_request.number }}.${{ secrets.VPS_DOMAIN }}
                    
      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `http://pr-${{ github.event.pull_request.number }}.${{ secrets.VPS_DOMAIN }}`;
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview URL: ${previewUrl}`
            });

      - name: Cleanup VPS Deployment
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            APP_NAME=pr-${{ github.event.pull_request.number }}
            APP_PATH=${{ secrets.VPS_PROJECT_ROOT }}/$APP_NAME
            cd $APP_PATH
            docker-compose down
            cd ..
            sudo rm -rf $APP_PATH
            docker image prune -f
