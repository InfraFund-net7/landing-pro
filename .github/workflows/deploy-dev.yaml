name: Deploy to Dev Environment
on:
  push:
    branches: ['develop']

jobs:
  build:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Docker image
        env:
          BUILD_ARG_API: ${{ secrets.DEV_API_BASE_URL }}
          BUILD_ARG_DASH_LOGIN: ${{ secrets.DEV_DASHBOARD_URL }}
          BUILD_ARG_RECAPTCHA: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
          BUILD_ARG_PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BUILD_ARG_PAYLOAD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          case "${BUILD_ARG_PAYLOAD_DATABASE_URL:-}" in
            *"@127.0.0.1:"*|*"@localhost:"*)
              echo "ERROR: DATABASE_URL points to localhost. Use a Docker-reachable host/service (e.g. postgres:5432 on internal network)." >&2
              exit 1
              ;;
          esac
          SECDIR="/tmp/landing-docker-secrets-$$"
          mkdir -p "$SECDIR"
          trap 'rm -rf "$SECDIR"' EXIT
          printf '%s' "${BUILD_ARG_PAYLOAD_SECRET:-}" > "$SECDIR/payload"
          printf '%s' "${BUILD_ARG_PAYLOAD_DATABASE_URL:-}" > "$SECDIR/database"
          docker build \
            -f ./deployment/Dockerfile \
            --secret id=payload_secret,src="$SECDIR/payload" \
            --secret id=database_url,src="$SECDIR/database" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$BUILD_ARG_API" \
            --build-arg NEXT_PUBLIC_DASH_LOGIN_URL="$BUILD_ARG_DASH_LOGIN" \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY="$BUILD_ARG_RECAPTCHA" \
            -t infra-landing:dev .
      - name: Export image for deploy runner
        run: docker save infra-landing:dev | gzip > infra-landing-dev.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: infra-landing-dev
          path: infra-landing-dev.tar.gz
          retention-days: 1

  deploy:
    name: Deploy smoke test (GitHub-hosted)
    # TEST: ubuntu-latest so the job is picked up without self-hosted runners.
    # Real server deploy: change runs-on to [self-hosted, develop-runner] and restore steps below (see docs/deploy-self-hosted.md).
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: infra-landing-dev
      - name: Load and verify image
        run: |
          set -euo pipefail
          gunzip -c infra-landing-dev.tar.gz | docker load
          docker image inspect infra-landing:dev
          echo "Deploy smoke test OK (image loads on GitHub runner)."
          echo "Server compose deploy skipped — switch deploy job to self-hosted for infrafund-develop."
      # --- Restore for real deploy (self-hosted develop-runner) ---
