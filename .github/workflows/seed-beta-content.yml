name: Seed Beta Blog Content (temporary)

on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: SSH seed Payload content on beta
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,VM_USERNAME,POSTGRES_PASSWORD,PAYLOAD_SECRET,BLOB_READ_WRITE_TOKEN
          command_timeout: 15m
          script: |
            set -euo pipefail
            REPO_DIR="/home/$VM_USERNAME/landing-web"
            cd "$REPO_DIR"
            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            git -c http.extraheader="$AUTH_HEADER" fetch origin
            git checkout develop
            git -c http.extraheader="$AUTH_HEADER" pull origin develop

            echo "--- seeding home-page, site-pages, posts against beta infra-postgres ---"
            sudo docker run --rm \
              --network internal \
              -v "$REPO_DIR":/app \
              -w /app \
              -e DATABASE_URL="postgresql://infra_app:${POSTGRES_PASSWORD}@infra-postgres:5432/infrafund" \
              -e PAYLOAD_SECRET="${PAYLOAD_SECRET}" \
              -e BLOB_READ_WRITE_TOKEN="${BLOB_READ_WRITE_TOKEN}" \
              -e PAYLOAD_PUBLIC_SERVER_URL="https://beta.infrafund.net" \
              node:24-alpine \
              sh -c "apk add --no-cache libc6-compat >/dev/null && npm config set legacy-peer-deps true && npm ci --ignore-scripts && npx patch-package && node src/scripts/seed-all.mjs"

            echo "--- verifying posts ---"
            sudo docker exec infra-postgres psql -U infra_app -d infrafund -c 'SELECT slug, title, published FROM payload.posts;'
