name: Deploy to Production Environment
on:
  push:
    branches: ['main']
jobs:
  build:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Docker image
        env:
          BUILD_ARG_API: ${{ secrets.PROD_API_BASE_URL }}
          BUILD_ARG_DASH_LOGIN: ${{ secrets.DASHBOARD_URL }}
          BUILD_ARG_RECAPTCHA: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
          BUILD_ARG_PAYLOAD_SECRET: ${{ secrets.PROD_PAYLOAD_SECRET }}
          BUILD_ARG_PAYLOAD_DATABASE_URL: ${{ secrets.PROD_PAYLOAD_DATABASE_URL }}
        run: |
          set -euo pipefail
          SECDIR="/tmp/landing-docker-secrets-$$"
          mkdir -p "$SECDIR"
          trap 'rm -rf "$SECDIR"' EXIT
          printf '%s' "$BUILD_ARG_PAYLOAD_SECRET" > "$SECDIR/payload"
          printf '%s' "$BUILD_ARG_PAYLOAD_DATABASE_URL" > "$SECDIR/database"
          docker build \
            -f ./deployment/Dockerfile \
            --secret id=payload_secret,src="$SECDIR/payload" \
            --secret id=database_url,src="$SECDIR/database" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$BUILD_ARG_API" \
            --build-arg NEXT_PUBLIC_DASH_LOGIN_URL="$BUILD_ARG_DASH_LOGIN" \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY="$BUILD_ARG_RECAPTCHA" \
            -t infra-landing:prod .
      - name: Export image for deploy runner
        run: docker save infra-landing:prod | gzip > infra-landing-prod.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: infra-landing-prod
          path: infra-landing-prod.tar.gz
          retention-days: 1

  deploy:
    name: Deploy smoke test (GitHub-hosted)
    # TEST: ubuntu-latest so the job is picked up without self-hosted runners.
    # Real server deploy: change runs-on to [self-hosted, prod-runner] and restore steps below (see docs/deploy-self-hosted.md).
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: infra-landing-prod
      - name: Load and verify image
        run: |
          set -euo pipefail
          gunzip -c infra-landing-prod.tar.gz | docker load
          docker image inspect infra-landing:prod
          echo "Deploy smoke test OK (image loads on GitHub runner)."
          echo "Server compose deploy skipped — switch deploy job to self-hosted for production."
      # --- Restore for real deploy (self-hosted prod-runner) ---
      # - uses: actions/checkout@v6
