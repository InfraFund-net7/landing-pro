name: Deploy to Production Environment
on:
  push:
    branches: ['main']
jobs:
  build:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Docker image
        env:
          BUILD_ARG_API: ${{ secrets.PROD_API_BASE_URL }}
          BUILD_ARG_DASH_LOGIN: ${{ secrets.DASHBOARD_URL }}
          BUILD_ARG_RECAPTCHA: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
          BUILD_ARG_PAYLOAD_SECRET: ${{ secrets.PROD_PAYLOAD_SECRET }}
          BUILD_ARG_PAYLOAD_DATABASE_URL: ${{ secrets.PROD_PAYLOAD_DATABASE_URL }}
        run: |
          set -euo pipefail
          SECDIR="/tmp/landing-docker-secrets-$$"
          mkdir -p "$SECDIR"
          trap 'rm -rf "$SECDIR"' EXIT
          printf '%s' "$BUILD_ARG_PAYLOAD_SECRET" > "$SECDIR/payload"
          printf '%s' "$BUILD_ARG_PAYLOAD_DATABASE_URL" > "$SECDIR/database"
          docker build \
            -f ./deployment/Dockerfile \
            --secret id=payload_secret,src="$SECDIR/payload" \
            --secret id=database_url,src="$SECDIR/database" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$BUILD_ARG_API" \
            --build-arg NEXT_PUBLIC_DASH_LOGIN_URL="$BUILD_ARG_DASH_LOGIN" \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY="$BUILD_ARG_RECAPTCHA" \
            -t infra-landing:prod .

  deploy:
    name: Deploy to Production Server
    runs-on: prod-runner
    needs: build
    steps:
      - name: Deploy with Docker Compose
        env:
          PAYLOAD_SECRET: ${{ secrets.PROD_PAYLOAD_SECRET }}
          DATABASE_URL: ${{ secrets.PROD_PAYLOAD_DATABASE_URL }}
        run: docker compose -f ${{ vars.DOCKER_COMPOSE_PATH_PRODUCTION }} up -d landing --force-recreate
      - name: Wait for container readiness
        run: |
          echo "Waiting for container to be ready..."
          sleep 5
          docker compose -f ${{ vars.DOCKER_COMPOSE_PATH_PRODUCTION }} ps

      - name: Verify deployment
        run: |
          docker compose -f ${{ vars.DOCKER_COMPOSE_PATH_PRODUCTION }} logs --tail=20 landing
