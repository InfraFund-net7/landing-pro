name: Debug Landing App Logs (temporary)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH verify payload schema
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "--- payload schema tables ---"
            sudo docker exec infra-postgres psql -U infra_app -d infrafund -c '\dt payload.*'
            echo "--- any leftover bootstrap containers ---"
            sudo docker ps -a --filter ancestor=node:24-alpine
