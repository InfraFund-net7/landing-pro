name: Debug Landing App Logs (temporary)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH inspect repo state
        uses: appleboy/ssh-action@v1.0.3
        env:
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VM_USERNAME
          script: |
            REPO_DIR="/home/$VM_USERNAME/landing-web"
            cd "$REPO_DIR"
            echo "--- current HEAD ---"
            git log -1 --oneline
            echo "--- remote url ---"
            git remote -v
            echo "--- git fetch attempt (verbose) ---"
            git fetch origin 2>&1 || echo "FETCH FAILED with exit $?"
            echo "--- git config ---"
            git config --list | grep -i credential || echo "no credential config"
            echo "--- ls deployment dir ---"
            ls -la deployment/ || true
