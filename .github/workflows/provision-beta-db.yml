name: Provision Beta Postgres (temporary)

on:
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: SSH provision self-hosted Postgres for beta
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,POSTGRES_PASSWORD,VM_USERNAME
          command_timeout: 15m
          script: |
            set -euo pipefail
            REPO_DIR="/home/$VM_USERNAME/landing-web"
            cd "$REPO_DIR"
            git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch origin
            git checkout develop
            git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" pull origin develop

            echo "--- bringing up infra-postgres on beta VM ---"
            sudo docker network create internal 2>/dev/null || true
            POSTGRES_PASSWORD="$POSTGRES_PASSWORD" sudo -E docker compose -f deployment/docker-compose.db.yml up -d

            echo "--- waiting for postgres ready ---"
            for i in $(seq 1 30); do
              if sudo docker exec infra-postgres pg_isready -U infra_app -d infrafund >/dev/null 2>&1; then
                echo "postgres is ready"
                break
              fi
              sleep 2
            done

            echo "--- applying prelude (uuidv7 shim) ---"
            cat <<'PRELUDE_EOF' | sudo docker exec -i infra-postgres psql -U infra_app -d infrafund -v ON_ERROR_STOP=1
            -- Self-hosted Postgres (no pg_uuidv7 extension available): implement uuidv7() in
            -- pure SQL instead of the Neon-only extension used by backpro-neon-prelude.sql.
            -- gen_random_uuid() is built into Postgres core since v13 (pgcrypto not required).
            CREATE OR REPLACE FUNCTION public.uuidv7() RETURNS uuid
              LANGUAGE sql
              VOLATILE
            AS $$
              SELECT encode(
                set_bit(
                  set_bit(
                    overlay(
                      uuid_send(gen_random_uuid()) placing
                        substring(int8send(floor(extract(epoch FROM clock_timestamp()) * 1000)::bigint) FROM 3)
                        FROM 1 FOR 6
                    ),
                    52, 1
                  ),
                  53, 1
                ),
                'hex'
              )::uuid;
            $$;

            PRELUDE_EOF

            echo "--- applying backpro schema migrations ---"
            cat <<'SQL_SCHEMA_EOF' | sudo docker exec -i infra-postgres psql -U infra_app -d infrafund -v ON_ERROR_STOP=1
            BEGIN;

            CREATE TABLE waitlist (
                id UUID PRIMARY KEY DEFAULT uuidv7(),
                email VARCHAR(255) NOT NULL UNIQUE,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );

            CREATE INDEX idx_email ON waitlist (email);
            CREATE INDEX idx_waitlist_created_at ON waitlist (created_at);

            COMMIT;-- Contact status enum
            CREATE TYPE contact_status AS ENUM (
                'new',
                'in_progress',
                'answered',
                'waiting_customer',
                'resolved',
                'closed',
                'spam'
            );

            CREATE TABLE contact_forms (
                id UUID PRIMARY KEY DEFAULT uuidv7(),
                first_name VARCHAR(100) NOT NULL,
                last_name VARCHAR(100) NOT NULL,
                email VARCHAR(255) NOT NULL,
                Subject VARCHAR(255) NOT NULL,
                message TEXT NOT NULL,
                status contact_status NOT NULL DEFAULT 'new',
                ip TEXT,
                user_agent TEXT,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );

            CREATE INDEX idx_contact_forms_status ON contact_forms(status);
            CREATE INDEX idx_contact_forms_created_at ON contact_forms(created_at);
            CREATE INDEX idx_contact_forms_email ON contact_forms(email);BEGIN;

