name: Deploy LangGraph Agent to Azure VM

# Trigger the workflow only when you push code to your specific branch
on:
  push:
    branches:
      - infrafund-agents # 👈 Change this to your exact working branch name (e.g., feature/agent-langgraph)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMPOSE_MODEL: ${{ vars.COMPOSE_MODEL }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OPENAI_API_KEY,COMPOSE_MODEL
          script: |
            cd /home/${{ secrets.VM_USERNAME }}/landing-pro

            # 2. Fetch changes and switch cleanly to your branch
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # 3. Activate the Python virtual environment and update your agent's dependencies
            # (Assumes your venv folder is named 'venv'. Adjust if it's named 'env' or '.venv')
            if [ -d "venv" ]; then
              source venv/bin/activate
            else
              python3 -m venv venv
              source venv/bin/activate
            fi

            pip install --upgrade pip
            pip install -r ai-agent/requirements.txt

            if [ -z "${OPENAI_API_KEY:-}" ]; then
              echo "ERROR: Add OPENAI_API_KEY to GitHub repository secrets."
              exit 1
            fi

            MODEL="${COMPOSE_MODEL:-gpt-4.1-mini}"
            umask 077
            printf '%s\n' \
              "OPENAI_API_KEY=${OPENAI_API_KEY}" \
              "COMPOSE_MODEL=${MODEL}" \
              "AGENT_PORT=8080" \
              > ai-agent/.env

            REPO_ROOT="/home/${{ secrets.VM_USERNAME }}/landing-pro"
            sed "s|@DEPLOY_USER@|${{ secrets.VM_USERNAME }}|g; s|@REPO_ROOT@|${REPO_ROOT}|g" \
              ai-agent/content-agent.service | sudo tee /etc/systemd/system/content-agent.service > /dev/null

            sudo systemctl daemon-reload
            sudo systemctl enable content-agent.service
            sudo systemctl restart content-agent.service
            sudo systemctl is-active --quiet content-agent.service
