name: Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        if: github.event_name == 'push' || github.event.action != 'closed'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (Production)
        if: github.event_name == 'push'
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p ~/${{ secrets.VPS_PROJECT_ROOT }}/main
            cd ~/${{ secrets.VPS_PROJECT_ROOT }}/main
            git clone ${{ github.repository }} .
            cd landing-infrafund
            docker-compose down
            docker-compose up -d --build
          EOF

      - name: Deploy PR Preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p ~/${{ secrets.VPS_PROJECT_ROOT }}/pr-${{ github.event.pull_request.number }}
            cd ~/${{ secrets.VPS_PROJECT_ROOT }}/pr-${{ github.event.pull_request.number }}
            git clone ${{ github.repository }} .
            git checkout ${{ github.event.pull_request.head.sha }}
            cd landing-infrafund
            echo "PORT=$((3000 + ${{ github.event.pull_request.number }}))" > .env
            docker-compose up -d --build
          EOF

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `http://${{ secrets.VPS_HOST }}:${3000 + ${{ github.event.pull_request.number }}}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview URL: ${previewUrl}`
            });

      - name: Cleanup PR Preview
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ~/${{ secrets.VPS_PROJECT_ROOT }}/pr-${{ github.event.pull_request.number }}/landing-infrafund
            docker-compose down
            cd ../..
            rm -rf pr-${{ github.event.pull_request.number }}
          EOF
