name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare VPS Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_PATH=${{ secrets.VPS_PROJECT_ROOT }}/main
            mkdir -p $APP_PATH
            cd $APP_PATH
            docker-compose -f docker-compose.traefik.yml down || true
            docker image prune -f

      - name: Update the VPS deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: './'
          target: '${{ secrets.VPS_PROJECT_ROOT }}/main'

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_PATH=${{ secrets.VPS_PROJECT_ROOT }}/main
            cd $APP_PATH
            echo "APP_NAME=main" > .env
            echo "HOSTS=Host(\`infrafund.net\`) || Host(\`www.infrafund.net\`)" >> .env
            echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}" >> .env
            docker-compose -f docker-compose.traefik.yml up -d --build --remove-orphans
            docker image prune -f
