name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create App Name and Path
        id: vars
        run: |
          echo "APP_NAME=main" >> $GITHUB_ENV
          echo "APP_PATH=${{ secrets.VPS_PROJECT_PATH }}/main" >> $GITHUB_ENV

      - name: Prepare VPS Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            APP_PATH=${{ secrets.VPS_PROJECT_PATH }}/main
            mkdir -p $APP_PATH
            cd $APP_PATH
            docker-compose -f docker-compose-traefik.yml down
            docker image prune -f

      - name: Update the VPS deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./"
          target: "${{ secrets.VPS_PROJECT_PATH }}/main"

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            APP_PATH=${{ secrets.VPS_PROJECT_PATH }}/main
            cd $APP_PATH
            echo "APP_NAME=main" > .env
            docker-compose -f docker-compose-traefik.yml down
            docker-compose -f docker-compose-traefik.yml up -d --build --remove-orphans
            docker image prune -f
